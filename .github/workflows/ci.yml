name: CI

# Validate seed data, typecheck, and run the test suite on every push and PR.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: validate + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate seed data
        run: npm run validate

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
